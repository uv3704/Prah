name: Auto commit

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 0,6,12,18 * * *" # Runs 4 times a day (every 6 hours)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Modify last update
        run: |
          d=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "$d" > LAST_UPDATED

      - name: Commit and push changes
        run: |
          git config --local user.email "yuvisinghrathore678678@gmail.com"
          git config --local user.name "uv3704"
          git add LAST_UPDATED

          arr=(
            "chore(bot): 🚀 auto commit"
            "chore(bot): 🌳 keep the streak alive"
            "chore(bot): 🤖 automated update"
            "chore(bot): 🟩 green garden commit"
            "chore(bot): ⚡ daily activity tick"
            "chore(bot): 🌟 auto commit update"
            "chore(bot): 📈 contribution tracker"
            "chore(bot): 💻 continuous commits"
            "chore(bot): 👻 ghost commit"
            "chore(bot): 🥑 healthy github streak"
          )

          rand=$(( RANDOM % ${#arr[@]} ))
          commit_message="${arr[$rand]}"

          git commit -m "$commit_message" || echo "No changes to commit"
          git push origin master
